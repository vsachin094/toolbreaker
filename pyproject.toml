[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolrot"
version = "0.1.0"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pytest>=8.0", "typer>=0.12", "rich>=13.7"]

[project.scripts]
toolrot = "toolrot.cli:app"

[project.entry-points.pytest11]
toolrot = "toolrot.plugin"

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "W"]

[tool.pytest.ini_options]
markers = [
    "toolrot: toolrot chaos engineering tests",
]
pythonpath = ["src"]
testpaths = ["tests"]