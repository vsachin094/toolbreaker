name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Configure PyPI token authentication
        run: |
          echo "${{ secrets.PYPI_API_TOKEN }}" | python -m pip config set pypi.token __token__ || true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v2
        with:
          # Use token authentication instead of trusted publisher
          password: "${{ secrets.PYPI_API_TOKEN }}"
          username: "__token__"